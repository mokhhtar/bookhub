name: Indexing status (Search Console)

# Asks Search Console what it actually did with every URL in our sitemaps, and
# prints the answer into the run summary.
#
# This step deliberately does NOT store or publish anything yet. The first
# thing to establish is that the service account works and the API answers —
# a dashboard built on an unverified credential just moves the failure
# somewhere harder to read. Where the data ends up is the next commit.
#
# There is no "request indexing" step here and there will not be one: Google's
# Indexing API is limited to JobPosting and BroadcastEvent pages, so there is
# no supported way to ask for an ordinary page to be indexed. See the header of
# scripts/gsc_index_status.py for why that matters less than it sounds.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Inspect at most N URLs (0 = every URL in the sitemaps)"
        type: string
        default: "0"
  schedule:
    - cron: "20 7 * * 1" # Mondays 07:20 UTC, after the indexing drip at 06:40,
                         # so a promotion made this morning is already visible

permissions:
  contents: read

concurrency:
  group: indexing-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet google-auth requests

      - name: Ask Search Console
        env:
          # The key never touches the repo or the logs — the script reads it
          # from the environment and prints only per-URL states.
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${GSC_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::secret GSC_SERVICE_ACCOUNT is not set on this repository"
            exit 1
          fi
          python scripts/gsc_index_status.py \
            --limit "${{ inputs.limit || 0 }}" \
            --out /tmp/index-status.json | tee /tmp/index-status.txt

      # Send the snapshot to the dashboard Worker, which is where this data
      # lives — deliberately not committed here: the repo is public, and a
      # weekly commit would rebuild and redeploy the whole site for an
      # internal table. A missing secret is not a failure of the run; the
      # summary above is still the useful output.
      - name: Send it to the dashboard
        if: success()
        env:
          SEO_INGEST_SECRET: ${{ secrets.SEO_INGEST_SECRET }}
          # Optional, and currently UNSET — /ingest is reached through a
          # second, path-scoped Access application carrying a Bypass policy,
          # which is what actually works today. These are here for the day that
          # is swapped for a Service Auth policy (Access's own mechanism for
          # machine callers), so the switch costs two secrets and no code.
          #
          # Either way they would not replace the bearer secret below: Access
          # decides whether the request reaches the Worker, the Worker decides
          # whether to accept the write. Two independent gates on purpose.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SEO_STATUS_URL: ${{ vars.SEO_STATUS_URL || 'https://seo.litheca.com' }}
        run: |
          set -uo pipefail
          if [ -z "${SEO_INGEST_SECRET:-}" ]; then
            echo "SEO_INGEST_SECRET not set — skipping the dashboard push."
            exit 0
          fi
          ACCESS_HEADERS=()
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            ACCESS_HEADERS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
                            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          CODE=$(curl -sS -m 60 -o resp.txt -w '%{http_code}' \
                 -X POST "$SEO_STATUS_URL/ingest" \
                 "${ACCESS_HEADERS[@]}" \
                 -H "Authorization: Bearer $SEO_INGEST_SECRET" \
                 -H "Content-Type: application/json" \
                 --data-binary @/tmp/index-status.json)
          echo "ingest -> $CODE"
          # A 302 is Access, not the Worker: the request never arrived. Say so,
          # because "rejected the snapshot" sent the last reader looking at the
          # bearer secret when the caller had not got past the front door.
          if [ "$CODE" = "302" ] || [ "$CODE" = "301" ]; then
            echo "::error::Cloudflare Access redirected this to a login page — the request never reached the Worker, so nothing here is wrong with the secret. Check that the path-scoped Access application for seo.litheca.com/ingest exists AND has been published; an unpublished one silently leaves the parent application in charge."
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "response: $(head -c 300 resp.txt)"
            echo "::error::the Worker refused the snapshot (HTTP $CODE) — 403 means the bearer secret does not match INGEST_SECRET, 503 means it is unset on the Worker."
            exit 1
          fi
          echo "ok: $(cat resp.txt)"

      - name: Write the summary
        if: always()
        run: |
          {
            echo '## Indexing status'
            echo
            echo '```'
            sed -n '1,200p' /tmp/index-status.txt 2>/dev/null || echo "(no output — the step above failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept for one day only. It is a diagnostic, not a record, and the
      # permanent home for this data is the next step of the build.
      - name: Keep the raw JSON for a day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-status
          path: /tmp/index-status.json
          retention-days: 1
          if-no-files-found: ignore
