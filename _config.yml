title: "Litheca"
tagline: "Read less. Understand more."
description: "Seven AI-powered tools for readers — summaries, recommendations, discussion questions, comparisons, and more."
url: "https://litheca.com"
baseurl: ""
lang: "en"

author:
  name: "Litheca"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
# _books files are auto-committed by the backend after each new summary
# (see bookhub-api/github_publisher.py); their front-matter `slug` drives
# the /summary/<slug>/ permalink. Same for _authors at /authors/<slug>/.
collections:
  books:
    output: true
    permalink: /summary/:slug/
  authors:
    output: true
    permalink: /authors/:slug/
  characters:
    output: true
    permalink: /characters/:slug/

# Plugins
plugins:
  # jekyll-sitemap removed 2026-07-29: it emits one flat sitemap.xml, and the
  # site now hand-rolls a sitemap INDEX (sitemap.xml) plus per-type children
  # (sitemap-pages.xml, sitemap-books.xml) so Search Console reports coverage
  # per content type. Leaving the plugin in would fight the hand-written
  # /sitemap.xml for the same output path.
  - jekyll-seo-tag
  - jekyll-redirect-from

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  # Internal docs and dev artefacts. Without these, Jekyll copies them into
  # _site and serves them publicly — litheca.com/CLAUDE.md and, worse,
  # /SECURITY_AUDIT.md were returning 200, and they leaked into the sitemap.
  # None are needed by the served site. (.claude/.agents/_config.local.yml
  # are already skipped as dot/underscore-prefixed.)
  - README.md
  - CLAUDE.md
  - PRODUCT.md
  - SECURITY_AUDIT.md
  - skills-lock.json
  - firebase/DATA_MODEL.md
  # firestore.rules is a Firebase deploy artefact, enforced server-side; the
  # site only mentions it in comments and never fetches it. No reason to
  # publish the security model.
  - firebase/firestore.rules

# Defaults
# Deferred-indexing strategy: generated content collections ship with
# noindex + out of the sitemap until pages earn engagement (flip per-page
# or per-collection at launch). Core product pages (home, tools) stay
# indexable.
defaults:
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
      noindex: true
      sitemap: false
  - scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
      noindex: true
      sitemap: false
  # Category pages are thin (auto-listing shells) — keep them out of the
  # index/sitemap until they carry real content. Covers the hub too.
  - scope:
      path: "categories"
    values:
      noindex: true
      sitemap: false
  - scope:
      path: ""
    values:
      layout: "default"

# Backend API (Render — update after deploy)
api_url: "https://bookhub-api-hnv7.onrender.com"

# Printable editions on Cloudflare R2.
#
# /print/ tries this host FIRST and falls back to api_url when it misses, so
# leaving print_cdn empty simply keeps every print request on the old path —
# the feature degrades to exactly what shipped yesterday rather than breaking.
# Set it once the bucket has a custom domain (r2.dev is rate-limited and
# explicitly not for production).
#
# The version must match PRINT_KEY in the API's tools/reader.py ("readprint_v3"
# -> "v3"). A mismatch is not fatal — the object 404s and the API answers
# instead — but every print then pays the slow path, so bump both together.
print_cdn: ""
print_version: "v3"

# Amazon Associates tag
amazon_tag: "oceansidehair-20"
